services:
  bot-api-service:
    image: bot-api-service:prod
    container_name: bot-api-service-prod
    build:
      context: ./bot_service
      dockerfile: ./dockerfiles/prod_api.Dockerfile
    env_file:
        - ./bot_service/src/backend/etc/.env
    volumes:
      - ./common:/app/common
    healthcheck:
      test: curl --fail http://localhost:8081/api/health || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      - 8082:8081
    networks:
      - shared-network
    dns:
      - 8.8.8.8
    restart: "unless-stopped"

  bot-ui-service:
    image: bot-ui-service:prod
    container_name: bot-ui-service-prod
    build:
      context: ./bot_service
      dockerfile: ./dockerfiles/prod_ui.Dockerfile
    env_file:
      - ./bot_service/src/frontend/etc/.env
    volumes:
      - ./common:/app/common
    healthcheck:
      test: curl --fail http://localhost:3000 || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    ports:
      - "3001:3000"
    networks:
      - shared-network
    dns:
      - 8.8.8.8
    restart: "unless-stopped"
    command: ["npm", "start"]
    depends_on:
      - bot-api-service

networks:
  shared-network:
    external: true