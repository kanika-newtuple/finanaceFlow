{{- range .Values.services }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-deployment
  labels:
    app: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
      {{- if .metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .metrics.scrapePath | quote }}
        prometheus.io/port: {{ .port | quote }}
      {{- end }}
    spec:
      containers:
      - name: {{ .name }}
        image: {{ .imageName }}:{{ $.Values.releases.version }}
        imagePullPolicy: Always
        args:
          - "--persistence.file=/data/pushgateway.dat"
          - "--persistence.interval=5m"
        ports:
        - containerPort: {{ .port }}
        resources:
          {{- toYaml .resources | nindent 12 }}
        {{- if .persistence.enabled }}
        volumeMounts:
        - name: storage
          mountPath: /data
        {{- end }}
      {{- if .persistence.enabled }}
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ .name }}-pvc
      {{- end }}
---
{{- end }}
{{- end }}
